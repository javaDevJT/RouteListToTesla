name: Build and publish image

on:
  schedule:
    - cron: '5 4 * * *'
      timezone: America/Detroit
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cold_build:
        description: Run an isolated cold image build without reusable caches.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ghcr-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: truenas-routelisttotesla-storage-32g
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Start BuildKit storage collection
        run: ci-storage-efficiency start
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up private BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: tcp://buildkit:1234
          driver-opts: |
            cacert=/run/buildkit/tls/ca.pem
            cert=/run/buildkit/tls/client.pem
            key=/run/buildkit/tls/client.key

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare disk build cache
        id: ci_disk_cache_1
        if: ${{ inputs.cold_build != true }}
        run: ci-cache "routelisttotesla-linux-amd64"
      - name: Prepare immutable image and release tags
        id: container_security_1
        shell: bash
        env:
          SECURITY_PUBLISH: "true"
          SECURITY_RELEASE_TAGS: |
            ghcr.io/javadevjt/routelisttotesla:latest
            ghcr.io/javadevjt/routelisttotesla:sha-${{ github.sha }}
          SECURITY_REPORT_DIRECTORY: ${{ runner.temp }}/container-security/build-1
        run: bash .github/actions/container-security/container-security.sh prepare
      - name: Build, test, and publish
        id: container_build_1
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          outputs: ${{ steps.container_security_1.outputs.exporter }}
          cache-from: |
            ${{ inputs.cold_build != true && format('type=local,src={0}', steps.ci_disk_cache_1.outputs.from) || '' }}
            ${{ inputs.cold_build != true && 'type=gha,version=2,scope=routelisttotesla-linux-amd64' || '' }}
          cache-to: ${{ inputs.cold_build != true && steps.ci_disk_cache_1.outputs.to && format('type=local,dest={0},mode=max,ignore-error=true', steps.ci_disk_cache_1.outputs.to) || '' }}
          no-cache: ${{ inputs.cold_build }}
          context: .
          platforms: linux/amd64
          # Refresh the assembled runtime and its derived OCR environment together.
          no-cache-filters: runtime-base,ocr-build,runtime
          push: false # Push-by-digest is configured in the exporter; tags follow the scan.
          build-args: |
            VCS_REF=${{ github.sha }}
            ${{ inputs.cold_build && format('BUILDKIT_CACHE_MOUNT_NS=routelisttotesla-cold-{0}-{1}', github.run_id, github.run_attempt) || '' }}
          tags: ${{ steps.container_security_1.outputs.repository }}
      - name: Generate SBOM and enforce High/Critical vulnerability gate
        uses: ./.github/actions/container-security
        with:
          image: registry:${{ steps.container_security_1.outputs.repository }}@${{ steps.container_build_1.outputs.digest }}
          platforms: "linux/amd64"
          report-directory: ${{ runner.temp }}/container-security/build-1
          artifact-name: container-security-${{ github.job }}-${{ strategy.job-index || 0 }}-build-1
      - name: Finish and enforce BuildKit storage usage
        if: always()
        run: ci-storage-efficiency finish
      - name: Upload BuildKit storage usage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildkit-storage-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: |
            ${{ runner.temp }}/ci-storage-usage-start.json
            ${{ runner.temp }}/ci-storage-usage.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish release tags only after the vulnerability gate passes
        shell: bash
        env:
          SECURITY_IMAGE: ${{ steps.container_security_1.outputs.repository }}@${{ steps.container_build_1.outputs.digest }}
          SECURITY_REPORT_DIRECTORY: ${{ runner.temp }}/container-security/build-1
        run: bash .github/actions/container-security/container-security.sh publish
