server:
  port: 10088
  forward-headers-strategy: native
  tomcat:
    use-relative-redirects: true
  servlet:
    session:
      timeout: 4h
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: RouteListToTesla
  jackson:
    use-jackson2-defaults: true
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 100MB
  security:
    oauth2:
      client:
        registration:
          tap:
            client-id: ${TAP_CLIENT_ID:routelist}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            client-name: Tesla Automatic Preconditioning
            scope: routelist
            redirect-uri: ${TAP_REDIRECT_URI:https://teslarouter.javadevjt.tech/login/oauth2/code/tap}
        provider:
          tap:
            authorization-uri: ${TAP_AUTHORIZATION_URI:https://tap.javadevjt.tech/auth/delegate}
            token-uri: ${TAP_BASE_URL:https://tap.javadevjt.tech/api/v1}/delegation/token
            user-info-uri: ${TAP_BASE_URL:https://tap.javadevjt.tech/api/v1}/delegation/session
            user-name-attribute: sub

app:
  google:
    apiKey: ${google.api.key}
    geocodeUrl: "https://maps.googleapis.com/maps/api/geocode/json"
    regionBias: "us"

tap:
  base-url: ${TAP_BASE_URL:https://tap.javadevjt.tech/api/v1}
  client-key: ${TAP_CLIENT_KEY:}

ocr:
  language: ${OCR_LANGUAGE:eng}

navigation:
  arrival-radius-meters: ${NAV_ARRIVAL_RADIUS_METERS:75}
  max-telemetry-age-seconds: ${NAV_MAX_TELEMETRY_AGE_SECONDS:60}
  poll-interval-ms: ${NAV_POLL_INTERVAL_MS:5000}
