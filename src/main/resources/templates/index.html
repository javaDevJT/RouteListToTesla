<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route List to Tesla</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .content {
            padding: 30px 20px;
        }
        
        .step {
            margin-bottom: 30px;
        }
        
        .step-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e1e8ed;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        .file-input {
            width: 100%;
            padding: 12px;
            border: 2px dashed #e1e8ed;
            border-radius: 8px;
            background: #f8f9fa;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        
        .file-input:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }
        
        .file-input input[type="file"] {
            position: absolute;
            left: -9999px;
        }
        
        .file-list {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
        
        .btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-right: 10px;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-danger {
            background: #dc3545;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .hidden {
            display: none;
        }
        
        .address-list {
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 15px;
            background: #f8f9fa;
        }
        
        .address-group {
            border: 2px solid #dee2e6;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f8f9fa;
        }
        
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        
        .group-title {
            font-weight: 600;
            color: #2c3e50;
            margin: 0;
        }
        
        .group-send-btn {
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .group-send-btn:hover:not(:disabled) {
            background: #218838;
        }
        
        .group-send-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .address-item {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }
        
        .address-item:last-child {
            margin-bottom: 0;
        }
        
        .address-meta {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 8px;
        }
        
        .address-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .remove-address {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .add-address {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .content {
                padding: 20px 15px;
            }
            
            .container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 Route List to Tesla</h1>
        </div>
        
        <div class="content">
            <!-- Logout Button -->
            <div style="text-align: right; margin-bottom: 20px;">
                <a th:href="@{/logout}" style="color: #666; text-decoration: none; font-size: 14px;">🚪 Logout</a>
            </div>
            
            <!-- Step 1: Upload and Process -->
            <div class="step" id="step1">
                <div class="step-title">Step 1: Upload Images</div>
                
                <form id="uploadForm">
                    <div class="form-group">
                    <label for="vin">Select Tesla VIN</label>
                    <select id="vin" required>
                    <option value="">Choose VIN...</option>
                    <option value="5YJXCBE27GF010886">5YJXCBE27GF010886</option>
                    <option value="7G2CEHEE8SA071432">7G2CEHEE8SA071432</option>
                    </select>
                    </div>

                    <div class="form-group">
                        <label for="defaultState">Default State (for addresses without state)</label>
                        <select id="defaultState">
                            <option value="">None</option>
                            <option value="AL">Alabama</option>
                            <option value="AK">Alaska</option>
                            <option value="AZ">Arizona</option>
                            <option value="AR">Arkansas</option>
                            <option value="CA">California</option>
                            <option value="CO">Colorado</option>
                            <option value="CT">Connecticut</option>
                            <option value="DE">Delaware</option>
                            <option value="FL">Florida</option>
                            <option value="GA">Georgia</option>
                            <option value="HI">Hawaii</option>
                            <option value="ID">Idaho</option>
                            <option value="IL">Illinois</option>
                            <option value="IN">Indiana</option>
                            <option value="IA">Iowa</option>
                            <option value="KS">Kansas</option>
                            <option value="KY">Kentucky</option>
                            <option value="LA">Louisiana</option>
                            <option value="ME">Maine</option>
                            <option value="MD">Maryland</option>
                            <option value="MA">Massachusetts</option>
                            <option value="MI">Michigan</option>
                            <option value="MN">Minnesota</option>
                            <option value="MS">Mississippi</option>
                            <option value="MO">Missouri</option>
                            <option value="MT">Montana</option>
                            <option value="NE">Nebraska</option>
                            <option value="NV">Nevada</option>
                            <option value="NH">New Hampshire</option>
                            <option value="NJ">New Jersey</option>
                            <option value="NM">New Mexico</option>
                            <option value="NY">New York</option>
                            <option value="NC">North Carolina</option>
                            <option value="ND">North Dakota</option>
                            <option value="OH">Ohio</option>
                            <option value="OK">Oklahoma</option>
                            <option value="OR">Oregon</option>
                            <option value="PA">Pennsylvania</option>
                            <option value="RI">Rhode Island</option>
                            <option value="SC">South Carolina</option>
                            <option value="SD">South Dakota</option>
                            <option value="TN">Tennessee</option>
                            <option value="TX">Texas</option>
                            <option value="UT">Utah</option>
                            <option value="VT">Vermont</option>
                            <option value="VA">Virginia</option>
                            <option value="WA">Washington</option>
                            <option value="WV">West Virginia</option>
                            <option value="WI">Wisconsin</option>
                            <option value="WY">Wyoming</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Upload Images</label>
                        <div class="file-input-wrapper">
                            <div class="file-input" onclick="document.getElementById('images').click()">
                                <span>📸 Tap to select images</span>
                                <input type="file" id="images" multiple accept="image/*" required>
                            </div>
                            <div id="fileList" class="file-list"></div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn" id="processBtn">Process Images</button>
                    
                    <div id="processStatus" class="status hidden"></div>
                </form>
            </div>
            
            <!-- Step 2: Review and Edit Addresses -->
            <div class="step hidden" id="step2">
                <div class="step-title">Step 2: Review and Edit Addresses</div>
                <div style="margin-bottom: 15px; color: #666; font-size: 14px;">
                    Tesla supports up to 8 waypoints per route. If you have more than 8 addresses, they will be grouped automatically.
                </div>
                
                <div id="addressGroups">
                    <!-- Dynamic address groups will be populated here -->
                </div>
                
                <div style="margin-top: 15px;">
                    <button class="add-address" onclick="addNewAddress()">+ Add Address</button>
                </div>
                
                <div style="margin-top: 20px;">
                    <button class="btn btn-secondary" onclick="goBackToStep1()">Back</button>
                </div>
                
                <div id="sendStatus" class="status hidden"></div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let extractedAddresses = [];
        let currentVin = '';
        let selectedFiles = [];

        // Cookie helpers
        function setCookie(name, value, days = 30) {
            const expires = new Date();
            expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
            document.cookie = name + '=' + value + ';expires=' + expires.toUTCString() + ';path=/';
        }

        function getCookie(name) {
            const nameEQ = name + '=';
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // Load saved values on page load
        window.addEventListener('DOMContentLoaded', function() {
            const savedVin = getCookie('lastVin');
            const savedState = getCookie('lastDefaultState');
            if (savedVin) {
                document.getElementById('vin').value = savedVin;
            }
            if (savedState) {
                document.getElementById('defaultState').value = savedState;
            }
        });

        // Save values when changed
        document.getElementById('vin').addEventListener('change', function() {
            setCookie('lastVin', this.value);
        });
        document.getElementById('defaultState').addEventListener('change', function() {
            setCookie('lastDefaultState', this.value);
        });

        // DOM elements
        const uploadForm = document.getElementById('uploadForm');
        const processBtn = document.getElementById('processBtn');
        const sendBtn = document.getElementById('sendBtn');
        const processStatus = document.getElementById('processStatus');
        const sendStatus = document.getElementById('sendStatus');
        const fileInput = document.getElementById('images');
        const fileList = document.getElementById('fileList');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const addressGroups = document.getElementById('addressGroups');

        // SHA-256 calculation function
        async function calculateSHA256(file) {
            const arrayBuffer = await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            // Include filename in hash similar to backend
            const combined = hashHex + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
            return combined.substring(0, Math.min(64, combined.length));
        }

        // File input handler
        fileInput.addEventListener('change', async function() {
            const files = this.files;
            selectedFiles = [];
            
            if (files.length > 0) {
                let fileNames = '';
                showStatus('Calculating file hashes...', 'loading', processStatus);
                
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const hash = await calculateSHA256(file);
                    selectedFiles.push({
                        file: file,
                        hash: hash,
                        name: file.name
                    });
                    fileNames += `📄 ${file.name} (${hash.substring(0, 8)}...)<br>`;
                }
                
                fileList.innerHTML = `<strong>${files.length} file(s) selected:</strong><br>${fileNames}`;
                hideStatus(processStatus);
            } else {
                fileList.innerHTML = '';
                selectedFiles = [];
            }
        });

        // Step 1: Process images form handler
        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const vin = document.getElementById('vin').value;

            if (!vin || selectedFiles.length === 0) {
                showStatus('Please select a VIN and upload at least one image', 'error', processStatus);
                return;
            }

            currentVin = vin;
            processBtn.disabled = true;
            
            try {
                extractedAddresses = [];
                const filesToUpload = [];
                let cachedCount = 0;

                showStatus('Checking cache for existing processed images...', 'loading', processStatus);
                selectedFiles.sort((a, b) => a.name.localeCompare(b.name));
                // Check cache for each file
                for (let fileInfo of selectedFiles) {
                    const cacheResponse = await fetch('/route/cache/check', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            imageHash: fileInfo.hash,
                            filename: fileInfo.name
                        })
                    });

                    if (cacheResponse.ok) {
                        const cacheResult = await cacheResponse.json();
                        if (cacheResult.cached && cacheResult.candidates) {
                            // Use cached results
                            extractedAddresses.push(...cacheResult.candidates);
                            cachedCount++;
                            console.log(`Using cached results for ${fileInfo.name}`);
                        } else {
                            // Need to process this file
                            filesToUpload.push(fileInfo);
                        }
                    } else {
                        // Cache check failed, add to upload list
                        filesToUpload.push(fileInfo);
                    }
                }

                // Update status with cache results
                if (cachedCount > 0) {
                    showStatus(`Found ${cachedCount} cached image(s). Processing ${filesToUpload.length} new image(s)...`, 'loading', processStatus);
                }

                // Process new images if any
                if (filesToUpload.length > 0) {
                    const formData = new FormData();
                    for (let fileInfo of filesToUpload) {
                        formData.append('images', fileInfo.file);
                    }
                    formData.append('defaultState', document.getElementById('defaultState').value);

                    const response = await fetch('/route/places', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const result = await response.json();
                        extractedAddresses.push(...(result.candidates || []));
                    } else {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                }

                // Show final results
                if (extractedAddresses.length > 0) {
                    const cacheMsg = cachedCount > 0 ? ` (${cachedCount} from cache)` : '';
                    showStatus(`✅ Found ${extractedAddresses.length} address(es)${cacheMsg}`, 'success', processStatus);
                    setTimeout(() => {
                        showStep2();
                    }, 1500);
                } else {
                    showStatus('❌ No addresses found in images', 'error', processStatus);
                }

            } catch (error) {
                console.error('Error:', error);
                showStatus(`Error: ${error.message}`, 'error', processStatus);
            } finally {
                processBtn.disabled = false;
            }
        });

        function showStep2() {
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            populateAddressList();
        }

        function goBackToStep1() {
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
            hideStatus(sendStatus);
        }

        function populateAddressList() {
            addressGroups.innerHTML = '';
            
            // Split addresses into groups of 8
            const groupSize = 8;
            for (let i = 0; i < extractedAddresses.length; i += groupSize) {
                const group = extractedAddresses.slice(i, i + groupSize);
                const groupDiv = createAddressGroup(group, Math.floor(i / groupSize), i);
                addressGroups.appendChild(groupDiv);
            }
        }

        function createAddressGroup(addresses, groupIndex, startIndex) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'address-group';
            groupDiv.id = `group-${groupIndex}`;
            
            const groupHeader = document.createElement('div');
            groupHeader.className = 'group-header';
            
            const groupTitle = document.createElement('h3');
            groupTitle.className = 'group-title';
            groupTitle.textContent = `Route ${groupIndex + 1} (${addresses.length} addresses)`;
            
            const sendButton = document.createElement('button');
            sendButton.className = 'group-send-btn';
            sendButton.textContent = `Send Route ${groupIndex + 1} to Tesla`;
            sendButton.onclick = () => sendGroupToTesla(groupIndex, startIndex, addresses.length);
            
            groupHeader.appendChild(groupTitle);
            groupHeader.appendChild(sendButton);
            groupDiv.appendChild(groupHeader);
            
            // Add address list for this group
            const addressListDiv = document.createElement('div');
            addressListDiv.className = 'address-list';
            
            addresses.forEach((address, localIndex) => {
                const globalIndex = startIndex + localIndex;
                const addressItem = createAddressItem(address, globalIndex);
                addressListDiv.appendChild(addressItem);
            });
            
            groupDiv.appendChild(addressListDiv);
            return groupDiv;
        }

        function createAddressItem(address, index) {
            const div = document.createElement('div');
            div.className = 'address-item';
            
            const displayText = address.normalized;
            
            div.innerHTML = `
                <button class="remove-address" onclick="removeAddress(${index})" title="Remove address">×</button>
                <div class="address-meta">
                    Source: ${address.sourceImage || 'Unknown'} | 
                    Line: ${(address.lineIndex || 0) + 1} |
                    Coords: ${address.lat?.toFixed(4)}, ${address.lon?.toFixed(4)}
                </div>
                <textarea class="address-input" rows="2" placeholder="Enter address..." onchange="updateAddress(${index}, this.value)">${displayText}</textarea>
            `;
            return div;
        }

        function formatNormalizedAddress(normalized) {
            if (!normalized) return '';
            
            // The normalized text has format: "123 MAIN ST CITY STATE"
            // Convert back to: "123 Main St, City State" for better readability
            let formatted = normalized;
            
            // Add comma after street types followed by city names (generic approach)
            // Pattern: street type + space + city name
            // "123 MAIN ST ANYTOWN" -> "123 MAIN ST, ANYTOWN"
            formatted = formatted.replace(/\b(ALLEY|ALLY|ALY|AVENUE|AVE|AV|BOULEVARD|BLVD|CIRCLE|CIR|COURT|CT|DRIVE|DR|EXPRESSWAY|FREEWAY|HIGHWAY|HWY|LANE|LN|PARKWAY|PKWY|PLACE|PL|ROAD|RD|STREET|ST|TERRACE|TER|TRAIL|TRL|WAY)\s+([A-Z])/i, '$1, $2');
            
            // Convert to title case for better readability
            formatted = formatted.toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
            
            return formatted;
        }

        function updateAddress(index, newText) {
            if (extractedAddresses[index]) {
                extractedAddresses[index].text = newText;
            }
        }

        function removeAddress(index) {
            extractedAddresses.splice(index, 1);
            populateAddressList();
        }

        function addNewAddress() {
            const newAddress = {
                text: '',
                sourceImage: 'Manual Entry',
                lineIndex: 0,
                lat: null,
                lon: null,
                pid: null
            };
            extractedAddresses.push(newAddress);
            populateAddressList();
        }

        async function sendGroupToTesla(groupIndex, startIndex, groupSize) {
            if (!currentVin) {
                showStatus('Error: No VIN selected', 'error', sendStatus);
                return;
            }

            // Get addresses for this specific group
            const groupAddresses = extractedAddresses.slice(startIndex, startIndex + groupSize);
            
            // Filter out empty addresses
            const validAddresses = groupAddresses.filter(addr => addr.text && addr.text.trim().length > 0);
            
            if (validAddresses.length === 0) {
                showStatus(`No valid addresses in Route ${groupIndex + 1}`, 'error', sendStatus);
                return;
            }

            const sendButton = document.querySelector(`#group-${groupIndex} .group-send-btn`);
            sendButton.disabled = true;
            sendButton.textContent = 'Sending...';
            showStatus(`Sending Route ${groupIndex + 1} (${validAddresses.length} addresses) to Tesla...`, 'loading', sendStatus);

            try {
                // Send the group addresses to the backend
                const response = await fetch(`/route/send/${currentVin}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        candidates: validAddresses
                    })
                });

                if (response.ok) {
                    const result = await response.text();
                    if (result === 'true') {
                        showStatus(`✅ Route ${groupIndex + 1} successfully sent to Tesla!`, 'success', sendStatus);
                        sendButton.textContent = '✅ Sent';
                        sendButton.style.background = '#28a745';
                    } else {
                        throw new Error('Tesla API returned false');
                    }
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

            } catch (error) {
                console.error('Error:', error);
                showStatus(`Error sending Route ${groupIndex + 1}: ${error.message}`, 'error', sendStatus);
                sendButton.textContent = `Send Route ${groupIndex + 1} to Tesla`;
            } finally {
                sendButton.disabled = false;
            }
        }

        function showStatus(message, type, statusElement) {
            statusElement.textContent = message;
            statusElement.className = `status ${type}`;
            statusElement.classList.remove('hidden');
        }

        function hideStatus(statusElement) {
            statusElement.classList.add('hidden');
        }
    </script>
</body>
</html>
